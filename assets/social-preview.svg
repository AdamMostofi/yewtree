    <circle class="n1" cx="30" cy="42" r="10"/>
    <circle class="n2" cx="52" cy="22" r="10"/>
    <circle class="n3" cx="76" cy="22" r="10"/>
    <circle class="n4" cx="98" cy="42" r="10"/>
  </g>
  <text class="name" x="476" y="228">Yewtree</text>
  <text class="tag" x="482" y="290">Lossless, tree-structured memory</text>
  <text class="tag" x="482" y="334">for coding agents.</text>
  <text class="sub" x="482" y="392">Everything kept. Only what's needed, loaded.</text>
  <rect class="chip" x="482" y="430" width="160" height="46" rx="23" stroke-width="1.5"/>
  <text class="chipt" x="562" y="461" text-anchor="middle">Claude Code</text>
  <rect class="chip" x="654" y="430" width="136" height="46" rx="23" stroke-width="1.5"/>
  <text class="chipt" x="722" y="461" text-anchor="middle">OpenCode</text>
  <rect class="chip" x="802" y="430" width="66" height="46" rx="23" stroke-width="1.5"/>
  <text class="chipt" x="835" y="461" text-anchor="middle">Pi</text>
  <rect class="chip" x="880" y="430" width="104" height="46" rx="23" stroke-width="1.5"/>
  <text class="chipt" x="932" y="461" text-anchor="middle">Codex</text>
  <rect class="chip" x="996" y="430" width="150" height="46" rx="23" stroke-width="1.5"/>
  <text class="chipt" x="1071" y="461" text-anchor="middle">Gemini CLI</text>
