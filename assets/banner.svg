    <circle class="n2" cx="52" cy="22" r="10"/>
    <circle class="n3" cx="76" cy="22" r="10"/>
    <circle class="n4" cx="98" cy="42" r="10"/>
  </g>
  <text class="name" x="420" y="168">Yewtree</text>
  <text class="tag" x="424" y="218">Lossless, tree-structured memory for coding agents.</text>
