<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">Yewtree: lossless, tree-structured memory for coding agents</title>
  <desc id="d">The Yewtree logo, a trunk splitting into four branches, beside the name and the tagline, and the agents it works with.</desc>
  <style>
    .panel { fill: oklch(0.965 0.018 150); stroke: oklch(0.88 0.04 150); }
    .wood { stroke: oklch(0.40 0.08 152); }
    .root { stroke: oklch(0.40 0.08 152); opacity: .55; }
    .n1 { fill: oklch(0.52 0.12 152); } .n2 { fill: oklch(0.60 0.14 146); }
    .n3 { fill: oklch(0.66 0.14 140); } .n4 { fill: oklch(0.48 0.10 160); }
    .name { fill: oklch(0.30 0.07 152); font: 600 96px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, Roboto, sans-serif; letter-spacing: -2px; }
    .tag { fill: oklch(0.38 0.05 152); font: 400 30px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, Roboto, sans-serif; }
    .chip { fill: oklch(0.92 0.04 150); stroke: oklch(0.80 0.07 150); }
    .chipt { fill: oklch(0.34 0.07 152); font: 500 18px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, Roboto, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: oklch(0.22 0.025 152); stroke: oklch(0.34 0.04 152); }
      .wood, .root { stroke: oklch(0.86 0.06 150); }
      .n1 { fill: oklch(0.74 0.13 152); } .n2 { fill: oklch(0.80 0.14 146); }
      .n3 { fill: oklch(0.86 0.13 140); } .n4 { fill: oklch(0.70 0.11 160); }
      .name { fill: oklch(0.95 0.03 150); }
      .tag { fill: oklch(0.82 0.04 150); }
      .chip { fill: oklch(0.28 0.04 152); stroke: oklch(0.42 0.06 152); }
      .chipt { fill: oklch(0.88 0.05 150); }
    }
  </style>
  <rect class="panel" x="2" y="2" width="1276" height="356" rx="28" stroke-width="2"/>
  <g transform="translate(88 72) scale(1.7)">
